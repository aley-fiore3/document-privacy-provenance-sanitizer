services:
  - type: web
    name: fiore3-document-sanitizer
    runtime: docker
    plan: starter
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    disk:
      name: dpps-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: DPPS_UPLOADS_ENABLED
        value: "false"
      - key: DPPS_API_KEYS
        sync: false
      - key: DPPS_USAGE_DB
        value: /data/usage.sqlite3
      - key: DPPS_USAGE_DATABASE_URL
        sync: false
      - key: DPPS_AUDIT_LOG
        value: /data/audit.jsonl
      - key: DPPS_MAX_CONCURRENT_JOBS
        value: "2"
      - key: DPPS_PROCESSING_TIMEOUT_SECONDS
        value: "120"
